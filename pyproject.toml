[project]
name = "real-estate-paperwork-automator"
version = "0.1.0"
description = "Auto-fill Illinois real estate paperwork from natural-language notes and MLS screenshots."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "pypdf>=5.1",
    "pycryptodome>=3.21",
    "pypdfium2>=4.30",
    "Pillow>=10.4",
    "psycopg[binary,pool]>=3.2",
    "resend>=2.0",
    "itsdangerous>=2.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.8",
    "httpx>=0.27",
]
